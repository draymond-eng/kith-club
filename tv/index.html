.rail .eyebrow{

.rail .about strong{color:var(--cream);font-weight:700}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--cell);border:1px solid #302b27;border-radius:10px;padding:10px 8px}

}
function tick(){document.getElementById('clock').textContent=now().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
async function weather(){
  try{
    const j=await(await fetch(WEATHER,{cache:'no-store'})).json();
    const t=Math.round(j.current.temperature_2m);
    const hi=Math.round(j.daily.temperature_2m_max[0]),lo=Math.round(j.daily.temperature_2m_min[0]);
    document.getElementById('weather').textContent=`${cond(j.current.weather_code)} ${t} deg  |  H ${hi} deg L ${lo} deg`;
  }catch(e){document.getElementById('weather').textContent=''}
}
async function boot(){
  try{
    const j=await(await fetch('events.json',{cache:'no-store'})).json();
    events=j.events||j||[];
    document.getElementById('status').textContent=`Week view  |  Auto-refresh  |  ${events.length} events`;
  }catch(e){document.getElementById('status').textContent='Week view  |  Embedded  |  '+events.length+' events'}
  render();tick();weather();
}
boot();
setInterval(tick,15000);
setInterval(weather,15*60*1000);
setInterval(boot,7*60*1000);
addEventListener('resize',render);
</script></body></html>
