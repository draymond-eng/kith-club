const WEATHER='https://api.open-meteo.com/v1/forecast?latitude=41.8925&longitude=-87.6368&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=1';
let events=[];
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=()=>new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{if(!t)return'';if(t==='24:00')return'12am';let[a,b]=t.split(':').map(Number),ap=a>=12?'pm':'am';return `${a%12||12}${b?':'+pad(b):''}${ap}`};
function cond(c){const m={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',61:'Rain',71:'Snow',80:'Showers',95:'Storm'};return m[c]||'Chicago'};
function render(){
const n=now(),first=new Date(n.getFullYear(),n.getMonth(),1);
let start=new Date(first);start.setDate(first.getDate()-first.getDay());
const today=key(n),by={};events.forEach(e=>(by[e.date]??=[]).push(e));
document.getElementById('title').innerHTML=first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'<small>Club calendar</small>';
let html='';
for(let i=0;i<42;i++){
const d=new Date(start);d.setDate(start.getDate()+i);
const k=key(d),list=by[k]||[],out=d.getMonth()!==first.getMonth();
html+=`<section class="day${out?' out':''}${k===today?' today':''}"><div class="num">${d.getDate()}</div>${list.slice(0,4).map(e=>`<div class="ev"><b>${esc(e.title)}</b><small>${esc(e.start&&e.end?tm(e.start)+'–'+tm(e.end):tm(e.start||e.end))}</small></div>`).join('')}${list.length>4?`<div class="more">+${list.length-4} more</div>`:''}</section>`;
}
document.getElementById('grid').innerHTML=html;
}
function tick(){document.getElementById('clock').textContent=now().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
async function weather(){
try{
const j=await(await fetch(WEATHER,{cache:'no-store'})).json();
const t=Math.round(j.current.temperature_2m);
const hi=Math.round(j.daily.temperature_2m_max[0]),lo=Math.round(j.daily.temperature_2m_min[0]);
document.getElementById('weather').textContent=`${cond(j.current.weather_code)} ${t}° · H ${hi}° L ${lo}°`;
}catch(e){document.getElementById('weather').textContent='';}
}
async function boot(){
try{
const j=await(await fetch('events.json',{cache:'no-store'})).json();
events=j.events||j||[];
document.getElementById('status').textContent=`Auto-refresh · ${events.length} events`;
}catch(e){document.getElementById('status').textContent='Events unavailable'}
render();tick();weather();
}
boot();
setInterval(tick,15000);
setInterval(weather,15*60*1000);
setInterval(boot,7*60*1000);
addEventListener('resize',render);</script></body></html>
