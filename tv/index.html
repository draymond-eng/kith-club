<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Three Cities Social  |  River North Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0e0d0c;--elev:#161412;--cell:#1c1a18;--cream:#E0D4C8;--ink:#35302C;
  --mut:rgba(224,212,200,.48);--acc:#984929;--teal:#427179;--txt:#f3ebe0;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 var(--sans);overflow:hidden}
body{display:flex;flex-direction:column;padding:16px 20px;gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid #3a342e;padding-bottom:12px}
.brand{font:600 26px/1.05 var(--serif);color:var(--cream)}
.brand small{display:block;font:600 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-top:6px}
.title{text-align:center;font:600 32px/1.05 var(--serif);color:var(--cream)}
.title small{display:block;font:600 11px var(--sans);color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
.clock{text-align:right;font:500 20px/1.2 var(--serif);color:var(--cream)}
.clock small{display:block;font:500 11px var(--sans);color:var(--mut);margin-top:2px}
.weather{color:var(--cream);font:500 13px var(--sans);opacity:.9;margin-bottom:2px}
main{flex:1;min-height:0;display:flex;gap:16px}
.rail{
  width:26%;min-width:250px;max-width:400px;
  background:linear-gradient(180deg,#1a1714 0%,#141210 100%);
  border:1px solid #3a342e;border-radius:14px;padding:22px 18px 18px;
  display:flex;flex-direction:column;gap:0;justify-content:space-between;
}
.rail .eyebrow{
  font:700 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--teal);
  margin-bottom:12px;
}
.rail h1{
  font:600 1.85rem/1.12 var(--serif);color:var(--cream);margin-bottom:14px;
}
.rail .about{display:flex;flex-direction:column;gap:10px;font:500 15px/1.45 var(--sans);color:rgba(243,235,224,.78)}
.rail .about strong{color:var(--cream);font-weight:700}
.rail .rule{height:1px;background:#3a342e;margin:18px 0 16px;border:0}
.qrwrap{
  text-align:center;background:var(--cream);color:var(--ink);
  border-radius:12px;padding:14px 12px 12px;
}
.qrwrap img{
  width:min(100%,168px);height:auto;display:block;margin:0 auto 10px;
  border-radius:6px;background:#fff;padding:6px;
}
.qrwrap figcaption{
  font:700 12px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
}
.qrwrap figcaption .addr{
  display:block;margin-top:6px;font:600 12px/1.3 var(--sans);letter-spacing:.02em;
  text-transform:none;color:var(--acc);
}
.cal{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--cell);border:1px solid #302b27;border-radius:10px;padding:10px 8px}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px rgba(152,73,41,.55);background:#221c18}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #302b27}
.dow{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.today .dow{color:#d4a08a}
.num{font:600 32px/1 var(--serif);color:var(--cream)}
.today .num{color:#e8b89a}
.evs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.ev{border-left:3px solid var(--acc);background:#292520;padding:8px;border-radius:4px}
.ev b{display:block;font-weight:700;font-size:16px;line-height:1.25;color:var(--txt);font-family:var(--sans)}
.ev small{color:var(--mut);font-size:13px;display:block;margin-top:4px;font-weight:500}
.more{color:var(--acc);font-size:12px;margin-top:2px;font-weight:600}
.empty{color:var(--mut);font-size:14px;padding:4px 0;opacity:.7;font-weight:500}
footer{border-top:1px solid #302b27;padding-top:8px;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
@media(max-width:1100px){.rail{display:none}}
</style></head><body>
<!-- tcs-tv-rev:2026-09-22-week-c -->
<header>
  <div class="brand">Three Cities Social<small>River North  |  320 W. Ohio #7E</small></div>
  <div class="title" id="title">Loading<small>This week</small></div>
  <div class="clock"><div id="weather" class="weather"></div><span id="clock"></span><small>America/Chicago</small></div>
</header>
<main>
  <aside class="rail" aria-label="Welcome">
    <div>
      <div class="eyebrow">Welcome</div>
      <h1>Meet people in Chicago who stick around.</h1>
      <div class="about">
        <p>Your third space in River North for friendship, dinners, culture, and hangouts.</p>
        <p><strong>Members make the community.</strong> The rooms make it easy.</p>
      </div>
      <hr class="rule"/>
    </div>
    <figure class="qrwrap">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=https%3A%2F%2Fmeetings-na2.hubspot.com%2Fdraymond%3Fuuid%3D0f6ed97e-5852-459c-9c39-32b3e2f93b04" width="160" height="160" alt="QR to book a membership tour"/>
      <figcaption>Scan to book a tour<span class="addr">320 W Ohio #7E, River North</span></figcaption>
    </figure>
  </aside>
  <section class="cal"><div class="grid" id="grid"></div></section>
</main>
<footer>River North TV  |  <span id="status">Loading...</span></footer>
<script>
const TZ='America/Chicago';
const WEATHER='https://api.open-meteo.com/v1/forecast?latitude=41.8925&longitude=-87.6368&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=1';
window.TCS_EVENTS_EMBEDDED=[{"date": "2026-09-23", "title": "Trivia Night", "start": "19:00", "end": "21:00", "location": "River North"}, {"date": "2026-09-24", "title": "Sipping North of the Equator: Wine Tasting", "start": "19:00", "end": "21:00", "location": "River North"}, {"date": "2026-09-24", "title": "Book Club: Demon Copperhead", "start": "19:00", "end": "20:30", "location": "River North"}, {"date": "2026-09-25", "title": "Open House + Happy Hour Karaoke", "start": "17:30", "end": "21:00", "location": "River North"}, {"date": "2026-09-26", "title": "Come Back to Life: Introducing SUCO", "start": "11:00", "end": "12:00", "location": "River North"}, {"date": "2026-09-26", "title": "Lemonade: Film Watch Party", "start": "19:00", "end": "21:00", "location": "River North"}, {"date": "2026-09-28", "title": "Mahjong Evenings: The Wash", "start": "18:00", "end": "20:00", "location": "River North"}, {"date": "2026-09-28", "title": "Monday Night Football: Bears vs Eagles", "start": "18:30", "end": "22:00", "location": "River North"}, {"date": "2026-09-29", "title": "House Dinner Vol. 3", "start": "18:30", "end": "20:30", "location": "River North"}, {"date": "2026-09-29", "title": "No Book, Book Club: Can AI Connect With Us?", "start": "18:30", "end": "20:00", "location": "River North"}, {"date": "2026-09-29", "title": "Pilates with Rosie", "start": "19:00", "end": "20:00", "location": "River North"}, {"date": "2026-09-30", "title": "AI Signature Event: Claude 101", "start": "17:00", "end": "18:15", "location": "River North"}, {"date": "2026-09-30", "title": "Dating Detox", "start": "18:30", "end": "20:30", "location": "River North"}, {"date": "2026-10-01", "title": "Club Closed: Private Welcome Party", "start": "17:00", "end": "21:00", "location": "River North"}, {"date": "2026-10-02", "title": "Happy Hour: Open Bar", "start": "17:30", "end": "21:00", "location": "River North"}, {"date": "2026-10-04", "title": "Tailgate: TJs and Touchdowns", "start": "11:00", "end": "15:00", "location": "River North"}, {"date": "2026-10-06", "title": "Monthly Momentum Session", "start": "18:30", "end": "21:00", "location": "River North"}, {"date": "2026-10-08", "title": "Beef Takes: Defend Your Opinion", "start": "18:30", "end": "21:00", "location": "River North"}, {"date": "2026-10-09", "title": "Private Rental: Club Closed to Members", "start": "17:00", "end": "24:00", "location": "River North"}, {"date": "2026-10-10", "title": "Totally Awesome 90s Sleep Over", "start": "20:00", "end": "23:00", "location": "River North"}, {"date": "2026-10-14", "title": "Office Hours w/ Caralanay Cameron", "start": "15:00", "end": "20:00", "location": "River North"}, {"date": "2026-10-14", "title": "Dressed to Kill", "start": "19:00", "end": "21:00", "location": "River North"}, {"date": "2026-10-15", "title": "TCS Residency: Workplace Open Enrollment", "start": "18:00", "end": "19:30", "location": "River North"}, {"date": "2026-10-16", "title": "Happy Hour: Open Bar", "start": "17:30", "end": "21:00", "location": "River North", "sample": true}, {"date": "2026-10-17", "title": "Toy Story 5: Movie Morning", "start": "10:00", "end": "12:00", "location": "River North"}, {"date": "2026-10-22", "title": "How Women Lead: Room Rental (Club Open)", "start": "17:30", "end": "21:30", "location": "River North", "sample": true}, {"date": "2026-10-23", "title": "Happy Hour: Open Bar", "start": "17:30", "end": "21:00", "location": "River North", "sample": true}, {"date": "2026-10-23", "title": "Card Game Night", "start": "19:00", "end": "21:00", "location": "River North"}, {"date": "2026-10-24", "title": "Puzzle Night: Halloween Edition", "start": "16:00", "end": "21:00", "location": "River North"}, {"date": "2026-10-25", "title": "Tailgate: Rep Your Dip", "start": "12:00", "end": "15:00", "location": "River North"}, {"date": "2026-10-29", "title": "Fuckup Nights Chicago", "start": "18:30", "end": "21:00", "location": "River North"}, {"date": "2026-10-30", "title": "Happy Hour: Open Bar", "start": "17:30", "end": "21:00", "location": "River North", "sample": true}];
let events=window.TCS_EVENTS_EMBEDDED.slice();
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=()=>new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{if(!t)return'';if(t==='24:00')return'12am';let[a,b]=t.split(':').map(Number),ap=a>=12?'pm':'am';return `${a%12||12}${b?':'+pad(b):''}${ap}`};
function cond(c){const m={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',61:'Rain',71:'Snow',80:'Showers',95:'Storm'};return m[c]||'Chicago'};
function weekStart(n){
  const q=new URLSearchParams(location.search).get('start');
  if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)){
    const[y,m,d]=q.split('-').map(Number);
    return new Date(y,m-1,d);
  }
  return new Date(n.getFullYear(),n.getMonth(),n.getDate());
}
function fmtRange(a,b){
  const sameMonth=a.getMonth()===b.getMonth();
  const left=a.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const right=b.toLocaleDateString('en-US',sameMonth?{day:'numeric'}:{month:'short',day:'numeric'});
  return left+' - '+right+', '+a.getFullYear();
}
function render(){
  const n=now();
  const start=weekStart(n);
  const end=new Date(start);end.setDate(start.getDate()+6);
  const today=key(n),by={};events.forEach(e=>(by[e.date]??=[]).push(e));
  document.getElementById('title').innerHTML=esc(fmtRange(start,end))+'<small>This week</small>';
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=key(d),list=(by[k]||[]).slice().sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')));
    const isToday=k===today;
    const dow=isToday?'Today':d.toLocaleDateString('en-US',{weekday:'short'});
    const body=list.length
      ? list.slice(0,8).map(e=>`<div class="ev"><b>${esc(e.title)}</b><small>${esc(e.start&&e.end?tm(e.start)+'-'+tm(e.end):tm(e.start||e.end))}</small></div>`).join('')+(list.length>8?`<div class="more">+${list.length-8} more</div>`:'')
      : '<div class="empty">No events</div>';
    html+=`<section class="day${isToday?' today':''}"><div class="head"><span class="dow">${dow}</span><span class="num">${d.getDate()}</span></div><div class="evs">${body}</div></section>`;
  }
  document.getElementById('grid').innerHTML=html;
}
function tick(){document.getElementById('clock').textContent=now().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
async function weather(){
  try{
    const j=await(await fetch(WEATHER,{cache:'no-store'})).json();
    const t=Math.round(j.current.temperature_2m);
    const hi=Math.round(j.daily.temperature_2m_max[0]),lo=Math.round(j.daily.temperature_2m_min[0]);
    document.getElementById('weather').textContent=`${cond(j.current.weather_code)} ${t} deg  |  H ${hi} deg L ${lo} deg`;
  }catch(e){document.getElementById('weather').textContent=''}
}
async function boot(){
  try{
    const j=await(await fetch('events.json',{cache:'no-store'})).json();
    events=j.events||j||[];
    document.getElementById('status').textContent=`Week view  |  Auto-refresh  |  ${events.length} events`;
  }catch(e){document.getElementById('status').textContent='Week view  |  Embedded  |  '+events.length+' events'}
  render();tick();weather();
}
boot();
setInterval(tick,15000);
setInterval(weather,15*60*1000);
setInterval(boot,7*60*1000);
addEventListener('resize',render);
</script></body></html>
