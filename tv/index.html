<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Three Cities Social | River North Calendar</title>
</head>
<body style="margin:0;background:#0e0d0c;color:#e8dcc8;font:16px system-ui">
<p id="s" style="padding:24px">Loading River North calendar...</p>
<script>
(async()=>{
  const n=13;
  const parts=[];
  for(let i=0;i<n;i++){
    const r=await fetch('c'+i+'.txt',{cache:'no-store'});
    if(!r.ok) throw new Error('chunk '+i+' '+r.status);
    parts.push(await r.text());
  }
  // ASCII board: atob is safe. TextDecoder kept for future UTF-8.
  const bin=atob(parts.join(''));
  const bytes=Uint8Array.from(bin, c=>c.charCodeAt(0));
  const html=new TextDecoder('utf-8').decode(bytes);
  document.open(); document.write(html); document.close();
})().catch(e=>{ document.getElementById('s').textContent='Calendar failed to load: '+e.message; });
</script>
</body></html>
